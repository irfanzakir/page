<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>irfanzakir</title>
<meta name="description" content="Roblox Game Developer">
<style>
  :root {
    --bg-deep: #222831;
    --bg-panel: #393E46;
    --accent: #948979;
    --cream: #DFD0B8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-deep);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .card {
    max-width: 520px;
    width: 100%;
    text-align: center;
  }

  .wave {
    font-size: 40px;
    display: inline-block;
    animation: wave 2.2s infinite;
    transform-origin: 70% 70%;
  }

  @keyframes wave {
    0%, 60%, 100% { transform: rotate(0deg); }
    10%, 30% { transform: rotate(14deg); }
    20% { transform: rotate(-8deg); }
    40% { transform: rotate(-4deg); }
    50% { transform: rotate(10deg); }
  }

  h1 {
    font-size: clamp(1.6rem, 5vw, 2.1rem);
    font-weight: 700;
    margin: 12px 0 20px;
    color: #fff;
  }

  .avatar {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: 700;
    margin: 0 auto 18px;
    overflow: hidden;
    position: relative;
  }

  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .avatar span {
    position: relative;
  }

  p.tagline {
    color: var(--cream);
    font-size: 1rem;
    line-height: 1.5;
    margin: 0 0 4px;
  }

  p.subnote {
    color: var(--accent);
    font-size: 0.85rem;
    margin: 0 0 22px;
  }

  .cta {
    display: inline-block;
    padding: 10px 22px;
    background: var(--accent);
    color: var(--bg-deep);
    text-decoration: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.95rem;
    transition: opacity 0.15s ease;
  }

  .cta:hover { opacity: 0.85; }

  /* Showcase carousel */
  .showcase {
    margin-top: 36px;
    text-align: left;
  }

  .showcase h2 {
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
    text-align: center;
  }

  .carousel {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    max-height: 60vh;
    background: var(--bg-panel);
    border-radius: 14px;
    overflow: hidden;
    touch-action: pan-y;
  }

  .carousel-track {
    display: flex;
    height: 100%;
    transition: transform 0.35s ease;
  }

  .slide {
    flex: 0 0 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 0.9rem;
    user-select: none;
  }

  .slide img,
  .slide video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .slide.placeholder {
    border: 1px dashed var(--accent);
    margin: 6px;
    border-radius: 10px;
    width: calc(100% - 12px);
  }

  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(34, 40, 49, 0.7);
    color: var(--cream);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.1rem;
    transition: background 0.15s ease;
  }

  .carousel-btn:hover { background: rgba(34, 40, 49, 0.9); }
  .carousel-btn.prev { left: 10px; }
  .carousel-btn.next { right: 10px; }

  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--bg-panel);
    border: 1px solid var(--accent);
    cursor: pointer;
    padding: 0;
  }

  .dot.active { background: var(--accent); }

  .socials {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  .socials a {
    color: var(--cream);
    opacity: 0.8;
    transition: opacity 0.15s ease;
  }

  .socials a:hover { opacity: 1; }
  .socials svg { width: 22px; height: 22px; }

  footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--bg-panel);
    font-size: 0.78rem;
    color: var(--accent);
    text-align: center;
  }

  footer a { color: var(--accent); }

  @media (max-width: 420px) {
    .carousel-btn { width: 30px; height: 30px; font-size: 1rem; }
  }
</style>
</head>
<body>

<div class="card">
  <span class="wave">👋</span>
  <h1>Hai! Saya irfanzakir</h1>

  <div class="avatar">
    <span>IZ</span>
    <img src="images/profile.jpg" alt="Profile picture" onerror="if(!this.dataset.fallback){this.dataset.fallback=1;this.src='images/profile.png';}else{this.style.display='none';}">
  </div>

  <p class="tagline">Roblox Game Developer</p>
  <p class="subnote">Building systems, mechanics, and worlds in Lua/Luau.</p>

  <a class="cta" href="https://devforum.roblox.com/" target="_blank" rel="noopener">Learn More</a>

  <div class="showcase">
    <h2>Showcase</h2>
    <div class="carousel" id="carousel">
      <div class="carousel-track" id="track">
        <div class="slide"><img src="images/showcase1.jpg" alt="Showcase 1" onerror="if(!this.dataset.fallback){this.dataset.fallback=1;this.src='images/showcase1.png';}"></div>
        <div class="slide"><img src="images/showcase2.jpg" alt="Showcase 2" onerror="if(!this.dataset.fallback){this.dataset.fallback=1;this.src='images/showcase2.png';}"></div>
        <div class="slide"><video src="images/showcase3.mp4" muted loop playsinline preload="metadata"></video></div>
      </div>
      <button class="carousel-btn prev" id="prevBtn" aria-label="Previous image">&#10094;</button>
      <button class="carousel-btn next" id="nextBtn" aria-label="Next image">&#10095;</button>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="socials">
    <a href="https://github.com/irfanzakir" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.98 5.24.98 11.52c0 4.86 3.15 8.98 7.52 10.43.55.1.75-.24.75-.53 0-.26-.01-1.13-.01-2.06-3.06.56-3.85-.75-4.09-1.44-.14-.35-.73-1.44-1.25-1.73-.43-.23-1.04-.8-.02-.81.96-.02 1.65.89 1.88 1.25 1.1 1.85 2.86 1.33 3.55 1.02.11-.8.43-1.33.78-1.64-2.72-.31-5.58-1.36-5.58-6.05 0-1.34.48-2.43 1.26-3.29-.13-.31-.55-1.56.12-3.25 0 0 1.03-.33 3.38 1.25a11.6 11.6 0 0 1 6.15 0c2.35-1.58 3.38-1.25 3.38-1.25.67 1.69.25 2.94.12 3.25.79.86 1.26 1.94 1.26 3.29 0 4.71-2.87 5.73-5.6 6.03.44.38.83 1.12.83 2.26 0 1.63-.01 2.95-.01 3.35 0 .29.2.64.76.53 4.36-1.46 7.51-5.58 7.51-10.43C23.02 5.24 18.27.5 12 .5z"/></svg>
    </a>
    <a href="https://www.roblox.com/users/653209427/profile" target="_blank" rel="noopener" aria-label="Roblox">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.24 0 0 19.76 19.76 24 24 4.24 4.24 0Zm7.9 9.44 6.42 1.44-1.44 6.42-6.42-1.44 1.44-6.42Z"/></svg>
    </a>
  </div>

  <footer>
    Made with ❤️ &middot; <a href="https://claude.com" target="_blank" rel="noopener">Claude</a>
  </footer>
</div>

<script>
(function () {
  const track = document.getElementById('track');
  const slides = Array.from(track.children);
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dotsWrap = document.getElementById('dots');
  const carousel = document.getElementById('carousel');
  let index = 0;

  slides.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
    dot.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(dot);
  });

  const dots = Array.from(dotsWrap.children);

  function update() {
    track.style.transform = 'translateX(-' + (index * 100) + '%)';
    dots.forEach((d, i) => d.classList.toggle('active', i === index));

    slides.forEach((slide, i) => {
      const video = slide.querySelector('video');
      if (!video) return;
      if (i === index) {
        video.play().catch(() => {});
      } else {
        video.pause();
        video.currentTime = 0;
      }
    });
  }

  function goTo(i) {
    index = (i + slides.length) % slides.length;
    update();
  }

  prevBtn.addEventListener('click', () => goTo(index - 1));
  nextBtn.addEventListener('click', () => goTo(index + 1));

  // touch swipe
  let startX = 0;
  let isDragging = false;

  carousel.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    isDragging = true;
  }, { passive: true });

  carousel.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
  }, { passive: true });

  carousel.addEventListener('touchend', (e) => {
    if (!isDragging) return;
    const endX = e.changedTouches[0].clientX;
    const diff = endX - startX;
    if (Math.abs(diff) > 40) {
      if (diff > 0) goTo(index - 1);
      else goTo(index + 1);
    }
    isDragging = false;
  });

  // mouse drag (desktop)
  let mouseStartX = 0;
  let mouseDown = false;

  carousel.addEventListener('mousedown', (e) => {
    mouseStartX = e.clientX;
    mouseDown = true;
  });

  window.addEventListener('mouseup', (e) => {
    if (!mouseDown) return;
    const diff = e.clientX - mouseStartX;
    if (Math.abs(diff) > 40) {
      if (diff > 0) goTo(index - 1);
      else goTo(index + 1);
    }
    mouseDown = false;
  });

  // keyboard
  carousel.setAttribute('tabindex', '0');
  carousel.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goTo(index - 1);
    if (e.key === 'ArrowRight') goTo(index + 1);
  });

  update();
})();
</script>

</body>
</html>
