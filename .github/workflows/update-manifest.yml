name: Update image manifest

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate images/manifest.json
        run: |
          mkdir -p images
          cd images
          files=$(ls -1 | grep -vi '^manifest.json$' || true)
          {
            echo "["
            first=true
            for f in $files; do
              if [ "$first" = true ]; then
                first=false
              else
                echo ","
              fi
              printf '  "%s"' "$f"
            done
            echo ""
            echo "]"
          } > manifest.json

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update image manifest [skip ci]"
            git push
          else
            echo "No changes to manifest"
          fi
