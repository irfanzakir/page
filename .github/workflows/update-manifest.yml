name: Update image manifest

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate images/manifest.json
        run: |
          mkdir -p images
          cd images
          {
            echo "["
            first=true
            while IFS= read -r -d '' f; do
              name=$(basename "$f")
              if [ "$name" = "manifest.json" ]; then continue; fi
              if [ "$first" = true ]; then
                first=false
              else
                echo ","
              fi
              esc=$(printf '%s' "$name" | sed 's/\\/\\\\/g; s/"/\\"/g')
              printf '  "%s"' "$esc"
            done < <(find . -maxdepth 1 -type f -print0)
            echo ""
            echo "]"
          } > manifest.json

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update image manifest [skip ci]"
            git push
          else
            echo "No changes to manifest"
          fi
